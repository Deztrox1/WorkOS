name: workos migrate

# Applies db/migrations/*.sql to Supabase (tables os_*).
# - push to main : dry run, then apply pending migrations
# - workflow_dispatch : manual run, dry or apply
# Secret: SUPABASE_DB_URL (session pooler / direct, port 5432). Actions pinned to full SHAs (QA r1 Q17).
# apply.py refuses --apply unless the URL names project yourprojectref, and takes an advisory lock.

on:
  push:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "db/apply.py"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply pending migrations (false = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workos-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The `production` environment holds SUPABASE_DB_URL; give it a required reviewer in
    # Settings > Environments so a push to main cannot apply a migration unattended (audit finding 6).
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"   # must match the Python that compiled execution/requirements.txt (hash mode)

      - run: python -m pip install --quiet --require-hashes -r execution/requirements.txt

      - name: Fail early if the secret is missing
        if: env.SUPABASE_DB_URL == ''
        run: |
          echo "::error::SUPABASE_DB_URL secret is not set."
          exit 1

      - name: Dry run (always)
        run: python3 db/apply.py --dry-run

      - name: Apply
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        run: python3 db/apply.py --apply
