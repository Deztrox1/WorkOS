# WorkOS static site (PRD section 2). Installed as /etc/nginx/sites-available/workos,
# symlinked into sites-enabled. App rules live in /etc/nginx/snippets/workos-app.conf
# (infra/nginx/workos-app.snippet). Never touches example.ai, dooh, dooh-net, example.com.

# ---- contoso.example.net: the retired hostname, valid cert until Dec 2026, used for QA until the real DNS lands.
server {
    listen 443 ssl;
    server_name contoso.example.net;
    ssl_certificate     /etc/letsencrypt/live/contoso.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contoso.example.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://os.example.com$request_uri;
}

server {
    listen 80;
    server_name contoso.example.net;
    return 301 https://$host$request_uri;
}

# ---- os.example.com: port 80 only until DNS resolves and a cert exists.
# After the A record is live:
#   certbot certonly --webroot -w /var/www/workos-acme -d os.example.com -m alex@example.com --agree-tos -n
# then uncomment the 443 block below, nginx -t, reload.
server {
    listen 80;
    server_name os.example.com;
    location /.well-known/acme-challenge/ { root /var/www/workos-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name os.example.com;
    ssl_certificate     /etc/letsencrypt/live/os.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/workos-app.conf;
}
